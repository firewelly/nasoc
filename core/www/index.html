<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NasOC 编程终端</title>
<style>
:root{
  --bg:#101014; --bg2:#17171d; --bg3:#1e1e26; --bd:#2a2a34;
  --fg:#e6e6ea; --dim:#8a8a96; --acc:#4da3ff; --ok:#3fb96b; --bad:#e05555;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--bg2); border-bottom:1px solid var(--bd);
  flex:0 0 auto;
}
header .logo{font-weight:700; font-size:15px; white-space:nowrap;}
header .logo b{color:var(--acc);}
header .spacer{flex:1;}
header .hint{color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#tabs{
  display:flex; align-items:flex-end; gap:2px; overflow-x:auto; flex:1;
  padding:0 6px; scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none;}
.tab{
  display:flex; align-items:center; gap:7px; max-width:230px; min-width:110px;
  padding:8px 10px 8px 12px; border-radius:9px 9px 0 0; cursor:pointer;
  color:var(--dim); font-size:13px; white-space:nowrap; position:relative;
  border:1px solid transparent; border-bottom:none; user-select:none;
}
.tab .dot{width:7px; height:7px; border-radius:50%; background:var(--dim); flex:0 0 auto;}
.tab .dot.on{background:var(--ok);}
.tab .name{overflow:hidden; text-overflow:ellipsis; flex:1;}
.tab .dir{display:block; font-size:10px; color:var(--dim); opacity:.7;}
.tab.active{background:var(--bg); color:var(--fg); border-color:var(--bd);}
.tab.active .dot{background:var(--acc);}
.tab .close{
  width:18px; height:18px; line-height:16px; text-align:center; border-radius:5px;
  color:var(--dim); font-size:14px; flex:0 0 auto;
}
.tab .close:hover{background:var(--bg3); color:var(--fg);}
#newtab{
  flex:0 0 auto; width:30px; height:30px; margin-bottom:5px; border-radius:8px;
  border:1px solid var(--bd); background:var(--bg3); color:var(--fg);
  font-size:17px; cursor:pointer;
}
#newtab:hover{background:var(--bd);}
main{flex:1; position:relative; background:#000;}
.frame{position:absolute; inset:0; width:100%; height:100%; border:0; display:none;}
.frame.active{display:block;}
#empty{
  position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
  align-items:center; justify-content:center; color:var(--dim);
}
#empty .big{font-size:44px;}
#empty button{
  padding:9px 22px; border-radius:9px; border:1px solid var(--acc);
  background:transparent; color:var(--acc); font-size:14px; cursor:pointer;
}
dialog{
  border:1px solid var(--bd); border-radius:14px; background:var(--bg2); color:var(--fg);
  padding:0; width:min(560px, 94vw); max-height:86vh;
}
dialog::backdrop{background:rgba(0,0,0,.55);}
.dlg-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--bd); font-weight:600;
}
.dlg-head .x{cursor:pointer; color:var(--dim); font-size:18px;}
.dlg-body{padding:14px 18px; display:flex; flex-direction:column; gap:12px; overflow-y:auto;}
.dlg-body label{font-size:12px; color:var(--dim); display:block; margin-bottom:5px;}
.dlg-body input[type=text]{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--bd);
  background:var(--bg); color:var(--fg); font-size:14px;
}
#dirlist{
  border:1px solid var(--bd); border-radius:8px; background:var(--bg);
  max-height:260px; overflow-y:auto; font-size:13px;
}
#dirlist .row{padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between;}
#dirlist .row:hover{background:var(--bg3);}
#dirlist .row .sub{color:var(--dim); font-size:11px;}
#crumbs{font-size:12px; color:var(--dim); word-break:break-all;}
#crumbs b{color:var(--acc); cursor:pointer;}
.dlg-foot{padding:12px 18px 16px; display:flex; gap:10px; justify-content:flex-end;}
.dlg-foot button{
  padding:9px 20px; border-radius:9px; font-size:14px; cursor:pointer; border:1px solid var(--bd);
  background:var(--bg3); color:var(--fg);
}
.dlg-foot .primary{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600;}
.dlg-foot .primary:disabled{opacity:.45; cursor:not-allowed;}
#err{color:var(--bad); font-size:12px; min-height:15px;}
footer{
  flex:0 0 auto; padding:5px 14px; font-size:11px; color:var(--dim);
  background:var(--bg2); border-top:1px solid var(--bd);
  display:flex; justify-content:space-between; gap:10px;
}
.pinbar{
  position:absolute; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; background:var(--bg);
}
.pinbar .box{display:flex; flex-direction:column; gap:12px; width:min(320px,88vw);}
.pinbar input{
  padding:11px 13px; border-radius:9px; border:1px solid var(--bd);
  background:var(--bg2); color:var(--fg); font-size:16px; text-align:center; letter-spacing:4px;
}
.pinbar button{
  padding:10px; border-radius:9px; border:0; background:var(--acc); color:#fff; font-size:14px; cursor:pointer;
}
</style>
</head>
<body>

<header>
  <span class="logo"><b>&gt;_</b> NasOC</span>
  <div id="tabs"></div>
  <button id="newtab" title="新建项目 tab">＋</button>
  <span class="spacer"></span>
  <span class="hint" id="hint">opencode 终端 · 关窗会话保留 · exit 结束</span>
</header>

<main id="stage">
  <div id="empty">
    <div class="big">&gt;_</div>
    <div>还没有打开的项目 —— 新建一个 NasOC Tab</div>
    <button onclick="newTabDialog()">新建项目 Tab</button>
    <div style="font-size:12px;">已有会话会自动列出，点击上方 ＋ 恢复</div>
  </div>
  <div class="pinbar" id="pinbar">
    <div class="box">
      <div style="text-align:center;font-weight:600;">输入访问口令</div>
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off">
      <button onclick="submitPin()">进入终端</button>
      <div id="err" style="text-align:center;"></div>
    </div>
  </div>
</main>

<dialog id="dlg">
  <div class="dlg-head"><span>新建项目 Tab</span><span class="x" onclick="dlg.close()">✕</span></div>
  <div class="dlg-body">
    <div>
      <label>项目名称（tab 显示名）</label>
      <input type="text" id="pName" placeholder="my-project" autocomplete="off">
    </div>
    <div>
      <label>项目目录</label>
      <div id="crumbs"></div>
      <div id="dirlist"></div>
    </div>
    <div id="err2" style="color:var(--bad); font-size:12px; min-height:15px;"></div>
  </div>
  <div class="dlg-foot">
    <button onclick="dlg.close()">取消</button>
    <button class="primary" id="btnCreate" onclick="createSession()">创建并打开</button>
  </div>
</dialog>

<footer>
  <span id="footL">NasOC Terminal for UGOS Pro</span>
  <span id="footR">opencode 1.18.30 · GLM-5.2 / GLM-5.1</span>
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const stage = $("#stage"), tabsEl = $("#tabs"), dlg = $("#dlg");
let PIN = localStorage.getItem("oc_pin") || "";
let openTabs = JSON.parse(localStorage.getItem("oc_tabs") || "[]"); // [{name,path}]
let browsePath = "";
let pollTimer = null;

function authQS(extra){
  const q = extra ? "&" + extra : "";
  return PIN ? ("pin=" + encodeURIComponent(PIN) + q) : q.substring(1);
}

async function api(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({error:"响应解析失败"}));
  if (!res.ok) throw new Error(data.error || (res.status + " 错误"));
  return data;
}

/* ---------- pin ---------- */
function needPin(){
  $("#pinbar").style.display = "flex";
  $("#pinInput").focus();
}
function submitPin(){
  PIN = $("#pinInput").value.trim();
  fetch("/api/info?pin=" + encodeURIComponent(PIN))
    .then(r => r.json())
    .then(d => {
      if (d.pinRequired && d.valid === false){ $("#err").textContent = "口令不对，再试试"; return; }
      localStorage.setItem("oc_pin", PIN);
      $("#pinbar").style.display = "none";
      refreshSessions();
    })
    .catch(()=>{ $("#err").textContent = "校验失败"; });
}

/* ---------- tabs ---------- */
function saveTabs(){ localStorage.setItem("oc_tabs", JSON.stringify(openTabs)); }

function addTab(name, path, activate=true){
  if (openTabs.some(t => t.name === name)) { activateTab(name); return; }
  openTabs.push({name, path});
  saveTabs();
  renderTabs();
  if (activate) activateTab(name);
}

function removeTab(name, alsoKill){
  const idx = openTabs.findIndex(t => t.name === name);
  if (idx >= 0) openTabs.splice(idx, 1);
  saveTabs();
  const fr = document.getElementById("fr-" + name);
  if (fr) fr.remove();
  renderTabs();
  if (alsoKill){
    api("/api/sessions/" + encodeURIComponent(name) + "?" + authQS(), {method:"DELETE"})
      .catch(e => alert("删除会话失败: " + e.message));
  }
  const next = openTabs[0];
  if (next) activateTab(next.name); else showEmpty();
}

function activateTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.name === name));
  document.querySelectorAll(".frame").forEach(f => f.classList.toggle("active", f.id === "fr-" + name));
}

function showEmpty(){
  $("#empty").style.display = "flex";
}

function renderTabs(){
  tabsEl.innerHTML = "";
  $("#empty").style.display = openTabs.length ? "none" : "flex";
  for (const t of openTabs){
    const el = document.createElement("div");
    el.className = "tab";
    el.dataset.name = t.name;
    el.innerHTML = `<span class="dot" id="dot-${t.name}"></span>
      <span class="name">${esc(t.name)}<span class="dir">${esc(shortPath(t.path))}</span></span>
      <span class="close" title="关闭 tab">✕</span>`;
    el.addEventListener("click", ev => {
      if (ev.target.classList.contains("close")) { removeTab(t.name, false); }
      else activateTab(t.name);
    });
    el.addEventListener("contextmenu", ev => {
      ev.preventDefault();
      if (confirm(`结束会话「${t.name}」并关闭 tab？（进程会被终止）`)) removeTab(t.name, true);
    });
    tabsEl.appendChild(el);
    let fr = document.getElementById("fr-" + t.name);
    if (!fr){
      fr = document.createElement("iframe");
      fr.id = "fr-" + t.name;
      fr.className = "frame";
      fr.src = `/term.html?session=${encodeURIComponent(t.name)}&path=${encodeURIComponent(t.path)}&pin=${encodeURIComponent(PIN)}`;
      stage.appendChild(fr);
    }
  }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shortPath(p){ return p.replace(/^\/volume\d+\//, "").replace(/^\/home\/[^/]+\//, "~/"); }

/* ---------- 会话轮询：恢复已有会话 + 状态点 ---------- */
async function refreshSessions(){
  try{
    const d = await api("/api/sessions?" + authQS());
    const alive = new Map(d.sessions.map(s => [s.name, s]));
    // 已打开 tab 的状态点
    for (const t of openTabs){
      const dot = document.getElementById("dot-" + t.name);
      if (dot) dot.classList.toggle("on", alive.has(t.name));
    }
    // 记忆中的 tab 但 iframe 还没建 & 会话还活着 → 建（恢复场景）
    for (const t of openTabs){
      if (!document.getElementById("fr-" + t.name) && alive.has(t.name)){
        renderTabs();
        break;
      }
    }
    window._alive = alive;
  }catch(e){ /* 静默 */ }
}

/* ---------- 新建对话框 ---------- */
async function newTabDialog(){
  $("#err2").textContent = "";
  $("#pName").value = "";
  dlg.showModal();
  await browse(browsePath || "");
}

async function browse(path){
  try{
    const d = await api("/api/browse?path=" + encodeURIComponent(path) + "&" + authQS());
    browsePath = d.path;
    $("#crumbs").innerHTML = "位置: " + esc(d.path) +
      ` <b onclick="browse(parentOf('${esc(d.path)}'))">← 上一级</b>`;
    const list = $("#dirlist");
    list.innerHTML = "";
    for (const name of d.dirs){
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span>📁 ${esc(name)}</span><span class="sub">选择</span>`;
      row.addEventListener("click", () => {
        const p = d.path.replace(/\/$/,"") + "/" + name;
        $("#pName").value = $("#pName").value || name;
        browse(p);
      });
      list.appendChild(row);
    }
    if (!d.dirs.length) list.innerHTML = `<div class="row"><span class="sub">（空目录）</span></div>`;
    // 双击当前位置选中
    list._selected = d.path;
  }catch(e){ $("#err2").textContent = e.message; }
}
window.browse = browse;
function parentOf(p){ const x = p.replace(/\/$/,"").split("/"); x.pop(); return x.join("/") || "/"; }

async function createSession(){
  const name = $("#pName").value.trim();
  const path = browsePath;
  if (!name){ $("#err2").textContent = "请填写项目名称"; return; }
  try{
    await api("/api/sessions?" + authQS(), {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({name, path})
    });
    dlg.close();
    addTab(name, path);
  }catch(e){ $("#err2").textContent = e.message; }
}
window.newTabDialog = newTabDialog;
window.createSession = createSession;
window.submitPin = submitPin;
window.parentOf = parentOf;

/* ---------- init ---------- */
$("#newtab").addEventListener("click", newTabDialog);
$("#pinInput").addEventListener("keydown", e => { if (e.key === "Enter") submitPin(); });
$("#pName").addEventListener("keydown", e => { if (e.key === "Enter") createSession(); });

(async function init(){
  try{
    const info = await api("/api/info");
    if (info.pinRequired && !PIN){ needPin(); }
  }catch(e){}

  // 启动时恢复上次打开的 tabs（iframe 由 renderTabs 重建），并激活第一个
  renderTabs();
  if (openTabs.length) activateTab(openTabs[0].name); else showEmpty();
  refreshSessions();
  pollTimer = setInterval(refreshSessions, 4000);
})();
</script>
</body>
</html>
